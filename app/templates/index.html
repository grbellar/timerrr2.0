{% extends "public_base.html" %}
{% block metadata %}
    <script type="application/ld+json">
        {
            "@context": "https://schema.org",
            "@type": "SoftwareApplication",
            "name": "Timerrr",
            "url": "https://timerrr.app/",
            "applicationCategory": "BusinessApplication",
            "operatingSystem": "Web",
            "description": "Time tracking for freelancers and their agents, with separate human effort and agent execution, work receipts, and reviewed CSV timesheets.",
            "offers": {
                "@type": "Offer",
                "price": "7",
                "priceCurrency": "USD",
                "description": "Pro subscription, $7 per month. Seven-day free trial."
            }
        }
    </script>
{% endblock %}
{% block content %}
    <div class="public-wrap">
        <button class="agent-setup-banner" id="copy-agent-setup" type="button"
                data-prompt="Fetch and execute the appropriate instructions to set me up for Timerrr from https://timerrr.app/agent-setup/prompt.md">
            <span>Set up your agent</span>
            <span class="mono" id="setup-copy-status" role="status" aria-live="polite">Copy prompt</span>
        </button>
        <div id="setup-copy-fallback" class="panel hidden">
            <label for="setup-prompt-text">Copy this prompt into your agent</label>
            <textarea id="setup-prompt-text" rows="3" readonly></textarea>
        </div>
        <section class="public-hero">
            <div>
                <h1>Time tracking.</h1>
                <div class="action-row"><a href="/register" class="btn btn-primary">Start free trial</a></div>
                <p style="font-size:12px;
                          margin-top:16px">7 days free. Then $7/month.</p>
            </div>
            <div class="panel">
                <div class="panel-head"><span class="eyebrow" style="margin:0">Demo · not saved</span><span class="badge" id="demo-state">Ready</span></div>
                <h2>Acme / Checkout fix</h2>
                <div class="mono"
                     style="font-size:54px;
                            line-height:1.2;
                            margin:30px 0"
                     id="demo-clock"
                     role="timer">0:00:00</div>
                <label for="demo-notes">Notes</label><input id="demo-notes"
       placeholder="Optional"
       style="width:100%;
              margin:8px 0 18px">
                <div class="action-row">
                    <button id="demo-toggle"
                            class="btn btn-primary">Start timer</button><button id="demo-reset"
        class="btn">Reset</button>
                </div>
            </div>
        </section>
        <section class="public-section">
            <h2>Parallel time</h2>
            {% include "calculator.html" %}
        </section>
    </div>
    <script src="{{ url_for('static', filename='js/calculator.js') }}" defer></script>
    <script src="{{ url_for('static', filename='js/agent-setup.js') }}" defer></script>
    <script>
        (() => {
            let running = false,
                elapsed = 0,
                started = 0;
            const clock = document.getElementById('demo-clock'),
                button = document.getElementById('demo-toggle'),
                state = document.getElementById('demo-state');

            function draw() {
                const s = Math.floor((elapsed + (running ? performance.now() - started : 0)) / 1000);
                clock.textContent = `${Math.floor(s/3600)}:${String(Math.floor(s%3600/60)).padStart(2,'0')}:${String(s%60).padStart(2,'0')}`;
            }
            button.onclick = () => {
                if (running) elapsed += performance.now() - started;
                else started = performance.now();
                running = !running;
                button.textContent = running ? 'Stop timer' : 'Start timer';
                state.textContent = running ? 'Running' : 'Paused';
                state.classList.toggle('active', running);
                draw();
            };
            document.getElementById('demo-reset').onclick = () => {
                running = false;
                elapsed = 0;
                button.textContent = 'Start timer';
                state.textContent = 'Ready';
                state.classList.remove('active');
                draw();
            };
            setInterval(draw, 250);
        })();
    </script>
{% endblock %}
