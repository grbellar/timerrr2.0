<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="utf-8">
        <meta name="viewport" content="width=device-width,initial-scale=1">
        <title>{{ page_title|default("Time tracking for freelancers and their agents") }} · Timerrr</title>
        <meta name="description"
              content="{{ description|default('Track your time and your agents’ execution separately. Client timers, work receipts, MCP tools, and reviewed CSV timesheets.') }}">
        <link rel="canonical" href="https://timerrr.com{{ request.path }}">
        <meta property="og:title"
              content="{{ page_title|default('Time, accounted for.') }} · Timerrr">
        <meta property="og:type" content="website">
        <meta property="og:url" content="https://timerrr.com{{ request.path }}">
        <meta property="og:description"
              content="{{ description|default('Time tracking for freelancers and their agents. Separate human effort, agent execution, and waiting.') }}">
        <meta property="og:image" content="https://timerrr.com/static/preview.jpg">
        <meta name="twitter:card" content="summary_large_image">
        <link rel="icon" href="{{ url_for('static', filename='favicon.ico') }}">
        <link rel="stylesheet"
              href="{{ url_for('static', filename='css/style.css') }}">
        {% block metadata %}{% endblock %}</head><body><a class="skip-link" href="#main-content">Skip to content</a><header class="app-header"><div class="header-inner"><a class="wordmark" href="/">timerrr<span>.</span></a><nav class="public-nav"
     aria-label="Main navigation"
     style="margin-left:auto"><a class="nav-secondary" href="/guides/parallel-time">Calculator</a><a href="/guides/mcp">MCP guide</a><a href="/login">Log in</a><a class="btn btn-primary" href="/register">Start tracking</a></nav></div></header>
        <main id="main-content">{% block content %}{% endblock %}</main><footer class="app-footer"><span>Timerrr · Time, accounted for.</span><a href="/guides/agent-timekeeping">How time is counted</a><a href="/guides/mcp">MCP documentation</a></footer></body></html>
